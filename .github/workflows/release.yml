name: Publish preview release

on:
  push:
    branches: [main]

concurrency:
  group: npm-preview-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run verify:package

  release:
    needs: validate
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - run: npm ci
      - name: Use an npm CLI that supports trusted publishing
        run: npm install --global npm@11
      - name: Check release plan without publishing
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release -- --dry-run
      - name: Publish qualifying commits to npm preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
      - name: Create a GitHub prerelease only for a published version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$(git tag --points-at "$GITHUB_SHA" --list 'v*' | head -n 1)"
          if [[ -z "$tag" ]]; then
            echo 'No release tag on this commit.'
            exit 0
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists."
            exit 0
          fi
          for attempt in {1..20}; do
            if npm view "edge-commerce-cli@${tag#v}" version --prefer-online >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --generate-notes --prerelease --latest=false
              exit 0
            fi
            echo "Waiting for $tag to appear on npm (attempt $attempt/20)."
            sleep 15
          done
          echo "npm did not expose $tag; refusing to create a GitHub release." >&2
          exit 1
